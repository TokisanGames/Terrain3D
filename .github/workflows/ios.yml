name: 🍏 iOS Builds
on: [ workflow_call, workflow_dispatch ]

jobs:
  build:
    name: 🍏 iOS ${{ matrix.arch }} ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios]
        target: [debug, release]
        arch: [universal]

    steps:
      - name: Checkout Terrain3D
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Base Dependencies
        uses: ./.github/actions/base-deps
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Build Cache
        uses: ./.github/actions/build-cache
        with:
          cache-name: ${{ matrix.platform }}-${{ matrix.target }}
        continue-on-error: true

      - name: Build Terrain3D
        env:
          SCONS_CACHE: "${{ github.workspace }}/.scons-cache/"
        shell: sh
        run: |
          scons target=template_${{ matrix.target }} platform=${{ matrix.platform }} arch=${{ matrix.arch }} debug_symbols=no -j3

      - name: Prepare Files
        shell: sh
        run: |
          ls -l project/addons/terrain_3d/bin/*
          rm -v project/*.*
          cp -v '${{ github.workspace }}/README.md' '${{ github.workspace }}/LICENSE.txt' ${{ github.workspace }}/project/addons/terrain_3d/

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: t3d-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/project/

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          include-hidden-files: true
          name: ${{ github.event.repository.name }}
          pattern: t3d-*
          delete-merged: true
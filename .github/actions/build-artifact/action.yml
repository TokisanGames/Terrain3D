name: Build Terrain3D Artifact
description: Checkout, Deps, Cache, Build, Prepare, Upload

inputs:
  cache-name:
    required: true
  platform:
    required: true
  arch:
    required: true
  target:
    required: true
  flags:
    required: false
    default: ""
  scons-flags:
    required: false
    default: "debug_symbols=no -j4"
  threads:
    description: "Web only: nothreads or threads"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout Terrain3D
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Dependencies
      uses: ./.github/actions/dependencies
      with:
        platform: ${{ inputs.platform }}
        arch: ${{ inputs.arch }}

    - name: Load SCons Cache
      id: load-cache
      uses: ./.github/actions/load-cache
      with:
        cache-name: ${{ inputs.cache-name }}
      continue-on-error: true

    - name: Build Terrain3D
      shell: sh
      env:
        SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
      run: |
        scons target=template_${{ inputs.target }} \
              platform=${{ inputs.platform }} \
              arch=${{ inputs.arch }} \
              ${{ inputs.scons-flags }} \
              ${{ inputs.flags }}

    - name: Save SCons Cache
      if: steps.load-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.scons-cache/
        key: ${{ inputs.cache-name }}-${{ github.ref }}

    - name: Rename Web Artifacts
      if: inputs.platform == 'web' && inputs.threads != ''
      env:
        TARGET: ${{ inputs.target }}
        ARCH: ${{ inputs.arch }}
        THREADS: ${{ inputs.threads }}
      shell: sh
      run: |
        cd project/addons/terrain_3d/bin/
        src="libterrain.web.${TARGET}.${ARCH}.wasm"
        dst="libterrain.web.${TARGET}.${ARCH}.${THREADS}.wasm"
        if [ -f "$src" ]; then
          mv -v "$src" "$dst"
        else
          echo "Expected $src not found:"
          ls -la
          exit 1
        fi

    - name: Prepare Files
      shell: sh
      run: |
        ls -l project/addons/terrain_3d/bin/
        rm -v project/*.* || true
        cp -v "${{ github.workspace }}/README.md" \
              "${{ github.workspace }}/LICENSE.txt" \
              "${{ github.workspace }}/project/addons/terrain_3d/"

    - name: Upload Package
      uses: actions/upload-artifact@v7
      with:
        include-hidden-files: true
        name: t3d-${{ inputs.cache-name }}
        path: ${{ github.workspace }}/project/
